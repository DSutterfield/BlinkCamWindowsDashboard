<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blink DVR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; overflow: hidden; }

  .layout {
    display: grid;
    grid-template-columns: 300px 1fr 320px;
    height: 100vh;
    gap: 1px;
    background: #333;
  }

  .motion-indicator {
    display: inline-block;
    margin-left: 0.4rem;
    font-size: 1rem;
    animation: motion-pulse 1.2s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes motion-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.6; transform: scale(1.15); }
  }

  .clips-list-wrap .clip-icon {
    display: inline-block;
    margin-right: 0.4rem;
    font-size: 1rem;
    width: 1.5rem;
    text-align: center;
  }

  .panel { background: #222; }
  .panel-padded { padding: 1rem; overflow-y: auto; }
  .panel h2 {
    font-size: 0.8rem; margin-bottom: 0.75rem; color: #888;
    text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
  }

  /* LEFT: controls */
  .controls .system-arm { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
  .controls button.system-btn {
    flex: 1; padding: 0.75rem; border: none; border-radius: 4px;
    background: #444; color: #eee; cursor: pointer; font-weight: 600;
  }
  .controls button.system-btn:hover { background: #555; }
  .controls button.system-btn.armed { background: #c00; }
  .controls button.system-btn.disarmed { background: #060; }


  .camera-card {
    background: #2a2a2a; border-radius: 4px; margin-bottom: 0.6rem; overflow: hidden;
    transition: outline 0.15s;
  }
  .camera-card.active { outline: 2px solid #4a7a9a; }

  .camera-card .thumb-wrap {
    position: relative; background: #000; aspect-ratio: 16 / 9;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: filter 0.15s, box-shadow 0.15s;
  }
  .camera-card .thumb-wrap:hover {
    filter: brightness(1.15);
    box-shadow: inset 0 0 0 2px #4a90c2;
  }
  .camera-card .thumb-wrap:hover .thumb-refresh {
    opacity: 1;
    background: rgba(74, 144, 194, 0.9);
  }

  .camera-card img.thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera-card .no-thumb { color: #666; font-size: 0.75rem; }

  .camera-card .thumb-refresh {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,0.5); border: none; color: #eee;
    width: 28px; height: 28px; border-radius: 50%;
    cursor: pointer; font-size: 1rem; line-height: 1;
    opacity: 0.6;
    transition: opacity 0.15s, background 0.15s, transform 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .camera-card .thumb-refresh:hover {
    background: #4a90c2 !important;
    transform: rotate(90deg);
    opacity: 1 !important;
  }

  .camera-card .row {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem;
  }
  .camera-card .name { flex: 1; font-size: 0.85rem; }
  .camera-card .toggle {
    padding: 0.25rem 0.6rem; font-size: 0.7rem; border: none; border-radius: 3px;
    cursor: pointer; font-weight: 600;
  }
  .toggle.on { background: #060; color: white; }
  .toggle.off { background: #444; color: #aaa; }

  .refresh-btn {
    width: 100%; padding: 0.5rem; margin-top: 1rem;
    background: #335; color: #eee; border: none; border-radius: 3px; cursor: pointer;
    font-size: 0.85rem;
  }
  .refresh-btn:hover { background: #446; }

  .mark-all-viewed-btn {
  width: 100%;
  padding: 0.5rem;
  margin-top: 1rem;
  background: #5a4328;
  color: #eee;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  font-size: 0.85rem;
}

.mark-all-viewed-btn:hover {
  background: #705536;
}

.mark-all-viewed-btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.mark-all-spinner {
    display: inline-block;
    width: 0.9rem;
    height: 0.9rem;
    margin-right: 0.45rem;
    vertical-align: -0.15rem;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: mark-all-spinner-rotation 0.8s linear infinite;
}

.mark-all-viewed-btn.busy:disabled {
    opacity: 0.85;
}

@keyframes mark-all-spinner-rotation {
    to {
        transform: rotate(360deg);
    }
}

  /* CENTER: preview pane */
  .preview { padding: 0; display: flex; flex-direction: column; background: #000; }
  .preview .view-area {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .preview video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .preview img.preview-img { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .preview .placeholder { color: #555; font-size: 1.3rem; text-align: center; }
    .preview .loading-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }
    .preview .loading-overlay.visible {
        display: flex;
    }
    .preview .loading-overlay::after {
    content: "";
    width: 48px;
    height: 48px;
    border: 5px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: preview-spinner-rotation 0.8s linear infinite;
}
        .preview .loading-overlay::after {
            content: "";
            width: 48px;
            height: 48px;
            border: 5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: preview-spinner-rotation 0.8s linear infinite;
        }

    @keyframes preview-spinner-rotation {
        to {
            transform: rotate(360deg);
        }
    }
    .preview .loading-overlay.visible {
    display: flex;
}
    .preview .loading-overlay.visible {
    display: flex;
}
  .preview .info-bar {
    padding: 0.6rem 1rem; background: #111; color: #aaa; font-size: 0.85rem;
    border-top: 1px solid #333;
    display: flex; justify-content: space-between; align-items: center;
  }
  .preview .info-bar .clear-btn {
    background: #333; color: #ccc; border: none; border-radius: 3px;
    padding: 0.25rem 0.6rem; cursor: pointer; font-size: 0.75rem;
    display: none;
  }
  .preview .info-bar .clear-btn.visible { display: block; }
  .preview .info-bar .clear-btn:hover { background: #444; color: #fff; }

  /* RIGHT: clip list with sticky header */
  .clips { display: flex; flex-direction: column; overflow: hidden; }
  .clips-header {
    flex: 0 0 auto;
    padding: 1rem;
    background: #222;
    border-bottom: 1px solid #333;
  }
  .clips-header h2 { margin-bottom: 0.6rem; }
  .clips-header .refresh-btn { margin-top: 0.5rem; }

  /* 2026-08-13 - Dan/Sage:
   Global count of unreviewed clips.
   This count represents the complete clip collection, not just
   clips currently visible through search or date filtering.
  */
    
    .clips-title {
        display: flex;
        align-items: center;
        gap: 0.55rem;
    }

    .unreviewed-count {
        min-width: 1.65rem;
        height: 1.65rem;
        padding: 0 0.35rem;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #ff8c00;
        color: #111;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1;
    }

  .search-wrap { position: relative; }
  .search-input {
    width: 100%; padding: 0.5rem 2rem 0.5rem 0.6rem;
    background: #1a1a1a; color: #eee; border: 1px solid #444;
    border-radius: 3px; font-size: 0.85rem;
  }
  .search-input:focus { outline: none; border-color: #678; }
  .search-clear {
    position: absolute; right: 0.4rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #888; cursor: pointer;
    font-size: 1.1rem; line-height: 1; padding: 0 0.3rem;
    display: none;
  }
  .search-clear.visible { display: block; }
  .search-clear:hover { color: #fff; }

  .date-filter-row {
    display: flex; gap: 0.4rem; margin-top: 0.4rem; align-items: stretch;
  }
  .date-btn {
    flex: 1; padding: 0.4rem 0.6rem;
    background: #1a1a1a; color: #ccc; border: 1px solid #444;
    border-radius: 3px; cursor: pointer; font-size: 0.78rem;
    text-align: left;
  }
  .date-btn:hover { background: #252525; border-color: #555; }
  .date-btn.active { background: #1a3a4a; border-color: #4a7a9a; color: #fff; }
  .date-btn-clear {
    background: #1a1a1a; color: #888; border: 1px solid #444;
    border-radius: 3px; cursor: pointer; padding: 0 0.5rem;
    font-size: 1rem; line-height: 1; display: none;
  }
  .date-btn-clear.visible { display: block; }
  .date-btn-clear:hover { color: #fff; background: #2a2a2a; }

  .date-popover {
    display: none;
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
    background: #2a2a2a; border: 1px solid #555; border-radius: 4px;
    padding: 0.75rem; z-index: 200;
    box-shadow: 0 6px 18px rgba(0,0,0,0.7);
  }
  .date-popover.open { display: block; }
  .date-popover h3 {
    font-size: 0.7rem; color: #888; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 0.5rem; font-weight: 600;
  }
  .date-popover .field { margin-bottom: 0.6rem; }
  .date-popover label {
    display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 0.2rem;
  }
  .date-popover input[type="date"] {
    width: 100%; padding: 0.4rem;
    background: #1a1a1a; color: #eee; border: 1px solid #444;
    border-radius: 3px; font-size: 0.85rem;
    color-scheme: dark;
  }
  .date-popover input[type="date"]:focus { outline: none; border-color: #678; }
  .date-popover .presets {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem;
    margin-bottom: 0.6rem;
  }
  .date-popover .preset {
    padding: 0.35rem; font-size: 0.75rem;
    background: #1a1a1a; color: #ccc; border: 1px solid #444;
    border-radius: 3px; cursor: pointer;
  }
  .date-popover .preset:hover { background: #252525; border-color: #678; color: #fff; }
  .date-popover .actions { display: flex; gap: 0.4rem; }
  .date-popover .actions button {
    flex: 1; padding: 0.45rem; font-size: 0.8rem; font-weight: 600;
    border: none; border-radius: 3px; cursor: pointer;
  }
  .date-popover .btn-apply { background: #060; color: white; }
  .date-popover .btn-apply:hover { background: #080; }
  .date-popover .btn-cancel { background: #444; color: #ccc; }
  .date-popover .btn-cancel:hover { background: #555; }

  .search-status {
    font-size: 0.72rem; color: #888; margin-top: 0.4rem;
    min-height: 0.9rem;
  }

        .sort-select {
            width: 100%;
            margin-top: 0.4rem;
            padding: 0.45rem 0.6rem;
            background: #1a1a1a;
            color: #eee;
            border: 1px solid #444;
            border-radius: 3px;
            font-size: 0.82rem;
            cursor: pointer;
        }

        .sort-select:focus {
            outline: none;
            border-color: #678;
        }
  .clips-list-wrap {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0 0.5rem 0.5rem 0.5rem;
  }
  .clips-list-wrap ul { list-style: none; }
  .clips-list-wrap li {
    padding: 0.6rem 0.5rem; border-bottom: 1px solid #333; cursor: pointer;
    font-size: 0.85rem;
    display: flex; align-items: flex-start; gap: 0.4rem;
  }
  .clips-list-wrap li:hover { background: #2c2c2c; }
  .clips-list-wrap li.active { background: #1a4a1a; }
  .clips-list-wrap .clip-body { flex: 1 1 auto; min-width: 0; }
  .clips-list-wrap .filename { font-weight: 600; word-break: break-all; }
  .clips-list-wrap .meta { color: #888; font-size: 0.72rem; margin-top: 0.2rem; }
    /* 2026-08-13 - Dan/Sage:
   Three-column Recorded Clips layout.
   Left   = clip thumbnail
   Middle = camera/system/date
   Right  = viewed status/time/trigger/delete
*/
    

    .clip-thumbnail-column {
        flex: 0 0 4.5rem;
        width: 4.5rem;
        height: 3.2rem;
        border-radius: 4px;
        overflow: hidden;
        background: #222;
        border: 1px solid #3a3a3a;
    }

    .clip-thumbnail {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .clip-info-column {
        flex: 1 1 auto;
        min-width: 0;
    }

    .clip-camera-name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .clip-system-name {
        margin-top: 0.25rem;
        color: #999;
        font-size: 0.72rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .clip-datetime {
        margin-top: 0.15rem;
        font-size: 0.72rem;
        font-weight: 600;
        white-space: nowrap;
    }

    .clip-status-column {
        flex: 0 0 auto;
        min-width: 2.8rem;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
    }

    .clip-status-top {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        white-space: nowrap;
    }

    .clip-time {
        font-size: 0.78rem;
    }

    .clip-trigger {
        min-height: 1rem;
    }

    /* 2026-08-11 - Dan/Sage:
   Persistent Blink-style indicator for an unviewed clip.
   Viewing the clip marks it as viewed.
    */
    .clip-unviewed-indicator {
        flex: 0 0 auto;
        width: 0.7rem;
        height: 0.7rem;
        margin: 0;
        border-radius: 50%;
        background: #ff8c00;
    }

  /* Per-clip delete button */
  .clip-delete-btn {
    flex: 0 0 auto;
    background: none; border: none; color: #777;
    cursor: pointer; font-size: 0.95rem; line-height: 1;
    padding: 0.15rem 0.35rem; border-radius: 3px;
    opacity: 1;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
  }
  .clips-list-wrap li:hover .clip-delete-btn { opacity: 1; }
  .clip-delete-btn:hover { color: #fff; background: #c0392b; }

    .clip-progress-wrap {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem;
    }

        .clip-progress-wrap[hidden] {
            display: none;
        }

    .clip-progress {
        flex: 1;
        min-width: 0;
        cursor: pointer;
    }

    .clip-time {
        min-width: 7rem;
        text-align: right;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }
</style>
</head>
<body>
<div class="layout">

  <!-- LEFT: Controls -->
  <div class="panel panel-padded controls">
    <h2>System</h2>
    <div class="system-arm">
      <button id="btn-arm" class="system-btn" onclick="setSystemArm(true)">ARM</button>
      <button id="btn-disarm" class="system-btn" onclick="setSystemArm(false)">DISARM</button>
    </div>

    <h2>Cameras</h2>
    <div id="camera-list">Loading...</div>

    <button class="refresh-btn" onclick="refreshAllThumbs(this)">Refresh All Thumbnails</button>
    <button class="refresh-btn" onclick="loadCameras()">Reload Camera List</button>
  </div>

  <!-- CENTER: preview (image OR video) -->
  <div class="panel preview">
      <div class="view-area">
          <video id="video-player" style="display:none"></video>
          <img id="preview-img" class="preview-img" style="display:none" alt="">
          <div id="preview-loading" class="loading-overlay"></div>
          <div id="placeholder" class="placeholder">Click a camera or clip to view</div>
      </div>

      <div id="clip-progress-wrap"
           class="clip-progress-wrap"
           hidden>
          <input id="clip-progress"
                 class="clip-progress"
                 type="range"
                 min="0"
                 max="1000"
                 step="1"
                 value="0"
                 aria-label="Clip playback position"
                 oninput="seekClip(this.value)">

          <span id="clip-time" class="clip-time">
              0:00 / 0:00
          </span>
      </div>

      <div class="info-bar">
          <span id="info-text">No selection</span>

          <div style="display: flex; gap: 0.4rem;">
              <button class="clear-btn"
                      id="start-liveview"
                      onclick="startLiveView()">
                  ▶ Start Live View
              </button>

              <button class="clear-btn"
                      id="stop-liveview"
                      onclick="stopLiveView()">
                  ■ Stop Live View
              </button>

              <button class="clear-btn"
                      id="clear-preview"
                      onclick="clearPreview()">
                  ✕ Clear
              </button>
          </div>
      </div>
  </div>

  <!-- RIGHT: Clips with search + date filter -->
  <div class="panel clips">
      <div class="clips-header">
          <h2 class="clips-title">
              Recorded Clips
              <span id="unreviewed-count"
                    class="unreviewed-count"
                    title="Unreviewed clips"
                    style="display:none;">0</span>
          </h2>

          <div class="search-wrap">
              <input type="text" id="search-input" class="search-input"
                     placeholder="Search clips... (Enter to apply)"
                     oninput="onSearchInput()"
                     onkeydown="onSearchKey(event)">
              <button class="search-clear" id="search-clear" onclick="clearSearch()" title="Clear search">×</button>
          </div>

          <div class="date-filter-row" style="position:relative">
              <button class="date-btn" id="date-btn" onclick="toggleDatePopover(event)">
                  📅 Any date
              </button>
              <button class="date-btn-clear" id="date-clear" onclick="clearDateFilter()" title="Clear date filter">×</button>

              <div class="date-popover" id="date-popover">
                  <h3>Quick Presets</h3>
                  <div class="presets">
                      <button class="preset" onclick="applyPreset('today')">Today</button>
                      <button class="preset" onclick="applyPreset('yesterday')">Yesterday</button>
                      <button class="preset" onclick="applyPreset('last7')">Last 7 days</button>
                      <button class="preset" onclick="applyPreset('last30')">Last 30 days</button>
                  </div>

                  <h3>Custom Range</h3>
                  <div class="field">
                      <label for="date-start">From</label>
                      <input type="date" id="date-start">
                  </div>
                  <div class="field">
                      <label for="date-end">To</label>
                      <input type="date" id="date-end">
                  </div>

                  <div class="actions">
                      <button class="btn-cancel" onclick="closeDatePopover()">Cancel</button>
                      <button class="btn-apply" onclick="applyCustomRange()">Apply</button>
                  </div>
              </div>
          </div>

          <div class="search-status" id="search-status"></div>

          <select id="clip-sort"
                  class="sort-select"
                  onchange="changeClipSort(this.value)"
                  title="Choose clip display order">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
          </select>

          <button id="mark-all-viewed-btn"
                  class="mark-all-viewed-btn"
                  onclick="markAllClipsViewed()"
                  title="Mark all unreviewed clips as reviewed">
              Mark All Reviewed
          </button>

          <button class="refresh-btn" onclick="loadClips()">Refresh List</button>
      </div>

    <div class="clips-list-wrap">
      <ul id="clip-list"><li>Loading...</li></ul>
    </div>
  </div>

</div>

<script>
  function bust(url) { return url + '?t=' + Date.now(); }

   let allClips = [];
   let activeFilter = "";
   let dateStart = null;
   let dateEnd = null;
   let selectedCameraName = null;
   let selectedCameraThumbnailUrl = null;

    // 2026-08-02 - Dan/Sage:
    // Preserve the operator's preferred clip order between browser sessions.
    let clipSort = localStorage.getItem('blink_clip_sort') || 'newest';
    document.getElementById('clip-sort').value = clipSort;

// --- Close popovers on outside click -----------------------------------
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.date-filter-row')) {
      document.getElementById('date-popover').classList.remove('open');
    }
  });


  (function initSettings() {
    // 2026-08-04 - Dan/Sage:
    // Recorded clips must stop at the end. Remove any saved loop setting
    // left behind by the earlier, interrupted progress-bar changes.
    const video = document.getElementById('video-player');
    video.controls = false;
    video.removeAttribute('controls');
    video.loop = false;
    localStorage.removeItem('blink_loop');

    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    start.setDate(start.getDate() - 91);
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    end.setDate(end.getDate() + 1);

    dateStart = start;
    dateEnd = end;
    syncInputsFromDates();
    updateDateButton();
  })();


// --- Live motion polling ----------------------------------------------
  async function pollActiveMotion() {
    try {
      const res = await fetch('/api/active_motion');
      const active = await res.json();

      document.querySelectorAll('.camera-card').forEach(card => {
        const name = card.dataset.cameraName;
        const nameSpan = card.querySelector('.name');
        if (!nameSpan) return;

        // Remove any existing motion indicator
        const oldBadge = nameSpan.querySelector('.motion-indicator');
        if (oldBadge) oldBadge.remove();

        if (active[name]) {
          const cv = active[name].cv_detection || [];
          let icon = '🔴';
          let title = 'Motion detected';
          if (cv.includes('person') && cv.includes('vehicle')) {
            icon = '🚶🚗'; title = 'Person + Vehicle';
          } else if (cv.includes('person')) {
            icon = '🚶'; title = 'Person detected';
          } else if (cv.includes('vehicle')) {
            icon = '🚗'; title = 'Vehicle detected';
          } else if (active[name].source === 'pir') {
            icon = '〰️'; title = 'PIR motion';
          }

          const badge = document.createElement('span');
          badge.className = 'motion-indicator';
          badge.textContent = icon;
          badge.title = title;
          nameSpan.appendChild(badge);
        }
      });
    } catch (e) {
      // Silently swallow — motion polling errors shouldn't disrupt the UI
    }
  }

  // Poll every 5 seconds
  setInterval(pollActiveMotion, 5000);
  pollActiveMotion();  // immediate first poll

  /*
    Developer note - 2026-08-04, Dan and Sage:
    Connect the Dashboard preview controls to the Flask live-view bridge.
    Blink video is displayed as an MJPEG stream through preview-img.
  */
    // 2026-08-06 - Dan/Sage:
    // Allow the browser to display a pending status change before beginning
    // an asynchronous Live View request.
    function waitForBrowserPaint() {
        return new Promise(resolve => requestAnimationFrame(resolve));
    }

    // 2026-08-06 - Dan/Sage:
    // Control the center-panel activity spinner.
    function showPreviewLoading() {
        document
            .getElementById('preview-loading')
            .classList.add('visible');
    }

    function hidePreviewLoading() {
        document
            .getElementById('preview-loading')
            .classList.remove('visible');

    async function startLiveView() {
        if (!selectedCameraName) {
            return;
        }

        const img = document.getElementById('preview-img');
        const placeholder = document.getElementById('placeholder');
        const info = document.getElementById('info-text');
        const startBtn = document.getElementById('start-liveview');
        const stopBtn = document.getElementById('stop-liveview');

        startBtn.disabled = true;

        // 2026-08-06 - Dan/Sage:
        // Hide Start Live View immediately after it is clicked.
        // The Stop button appears only after Live View starts successfully.
        startBtn.classList.remove('visible');

        info.textContent = `⏳ Starting live view: ${selectedCameraName}`;
        showPreviewLoading();

        await waitForBrowserPaint();

        try {
            let result = null;

            // 2026-08-08 - Dan/Sage:
            // Blink sometimes returns an incomplete transport stream when Live View
            // is restarted immediately after a previous session stops.
            // Allow the first request immediately, but retry once after 5 seconds
            // when the failure looks like the transient Blink/FFmpeg reset condition.
            for (let attempt = 1; attempt <= 2; attempt++) {
                try {
                    const response = await fetch('/api/liveview/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: selectedCameraName
                        })
                    });

                    result = await response.json();

                    if (!response.ok || !result.ok) {
                        throw new Error(
                            result.error || 'Live view could not be started.'
                        );
                    }

                    break;
                } catch (error) {
                    const message = String(error.message || error).toLowerCase();

                    const transientStartFailure =
                        message.includes('timeouterror') ||
                        message.includes('ffmpeg') ||
                        message.includes('end of file') ||
                        message.includes('ts packet') ||
                        message.includes('codec parameters');

                    if (!transientStartFailure || attempt === 2) {
                        throw error;
                    }

                    info.textContent =
                        '⏳ Blink is still resetting. Retrying live view in 5 seconds...';

                    await new Promise(resolve => setTimeout(resolve, 5000));
                }
            }

            stopClipPlayback();

            img.removeAttribute('src');
            img.src = `/api/liveview/stream?t=${Date.now()}`;
            img.style.display = 'block';
            placeholder.style.display = 'none';

            info.textContent = `🔴 Live: ${selectedCameraName}`;

            startBtn.classList.remove('visible');
            stopBtn.classList.add('visible');
        } catch (error) {
            info.textContent = `⚠ Live view failed: ${error.message}`;

            startBtn.classList.add('visible');
            stopBtn.classList.remove('visible');
        } finally {
            hidePreviewLoading();
            startBtn.disabled = false;
        }
    }

    async function stopLiveView() {
        const img = document.getElementById('preview-img');
        const info = document.getElementById('info-text');
        const startBtn = document.getElementById('start-liveview');
        const stopBtn = document.getElementById('stop-liveview');

        stopBtn.disabled = true;

        // 2026-08-06 - Dan/Sage:
        // Hide Stop Live View immediately after it is clicked.
        // Start Live View returns after the stop request completes.
        stopBtn.classList.remove('visible');

        info.textContent = '⏳ Stopping live view';
        showPreviewLoading();

        await waitForBrowserPaint();

        try {
            img.removeAttribute('src');

            const response = await fetch('/api/liveview/stop', {
                method: 'POST'
            });

            const result = await response.json();

            if (!response.ok || !result.ok) {
                throw new Error(
                    result.error || 'Live view could not be stopped.'
                );
            }

            if (selectedCameraThumbnailUrl) {
                img.src = bust(selectedCameraThumbnailUrl);
                img.style.display = 'block';
            }

            startBtn.classList.add('visible');
            stopBtn.classList.remove('visible');

            // 2026-08-08 - Dan/Sage:
            // Repeated cooldown-probe tests showed that Live View can be restarted
            // successfully with no enforced delay after the previous session stops.
            startBtn.disabled = false;

            if (selectedCameraName) {
                info.textContent = `📷 ${selectedCameraName}`;
            }

        } catch (error) {
            info.textContent = `⚠ Stop failed: ${error.message}`;
        } finally {
            hidePreviewLoading();
            stopBtn.disabled = false;
        }
    }

       async function playClip(filename, li, clip) {
        const video = document.getElementById('video-player');
        const img = document.getElementById('preview-img');
        const placeholder = document.getElementById('placeholder');
        const info = document.getElementById('info-text');
        const clearBtn = document.getElementById('clear-preview');
        const startBtn = document.getElementById('start-liveview');
        const stopBtn = document.getElementById('stop-liveview');

        video.onplaying = () => {
          if (clip && clip.watched === false) {
            markClipViewed(clip, li);
          }
         };

        // Stop and unload any previously selected clip before loading another.
        stopClipPlayback();
        video.loop = false;

        img.style.display = 'none';
        img.removeAttribute('src');

        video.style.display = 'block';
        placeholder.style.display = 'none';
        showClipProgress();
        showPreviewLoading();

        await waitForBrowserPaint();

        // 2026-08-06 - Dan/Sage:
        // Live View controls apply only to a selected camera,
        // not while a recorded clip is displayed.
        startBtn.classList.remove('visible');
        stopBtn.classList.remove('visible');

        // 2026-08-06 - Dan/Sage:
        // Keep the center-panel spinner visible until the selected clip
        // is ready for playback or loading fails.
        const finishClipLoading = () => {
            hidePreviewLoading();

            video.removeEventListener('canplay', finishClipLoading);
            video.removeEventListener('error', finishClipLoading);
        };

        video.addEventListener('canplay', finishClipLoading);
        video.addEventListener('error', finishClipLoading);

        video.src = `/clips/${encodeURIComponent(filename)}`;
        video.load();

    const playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(e => console.error('Clip playback failed:', e));
    }

    info.textContent = `🎬 ${filename}`;
    clearBtn.classList.add('visible');

    document.querySelectorAll('#clip-list li').forEach(el => el.classList.remove('active'));
    li.classList.add('active');

    document.querySelectorAll('.camera-card').forEach(c => c.classList.remove('active'));
  }

   function formatClipTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) {
            return '0:00';
        }

        const totalSeconds = Math.floor(seconds);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const secs = totalSeconds % 60;

        if (hours > 0) {
            return (
                `${hours}:` +
                `${String(minutes).padStart(2, '0')}:` +
                `${String(secs).padStart(2, '0')}`
            );
        }

        return `${minutes}:${String(secs).padStart(2, '0')}`;
    }

    function updateClipProgress() {
        const video = document.getElementById('video-player');
        const progress = document.getElementById('clip-progress');
        const time = document.getElementById('clip-time');

        const duration = Number.isFinite(video.duration)
            ? video.duration
            : 0;

        const current = Number.isFinite(video.currentTime)
            ? video.currentTime
            : 0;

        progress.value = duration > 0
            ? Math.round((current / duration) * 1000)
            : 0;

        time.textContent =
            `${formatClipTime(current)} / ${formatClipTime(duration)}`;
    }

    function seekClip(value) {
        const video = document.getElementById('video-player');

        if (!Number.isFinite(video.duration) || video.duration <= 0) {
            return;
        }

        video.currentTime =
            (Number(value) / 1000) * video.duration;

        updateClipProgress();
    }

    function showClipProgress() {
        const progressWrap =
            document.getElementById('clip-progress-wrap');

        progressWrap.hidden = false;
        updateClipProgress();
    }

    function hideClipProgress() {
        const progressWrap =
            document.getElementById('clip-progress-wrap');

        const progress =
            document.getElementById('clip-progress');

        const time =
            document.getElementById('clip-time');

        progressWrap.hidden = true;
        progress.value = 0;
        time.textContent = '0:00 / 0:00';
    }

    const videoPlayer =
        document.getElementById('video-player');

    videoPlayer.addEventListener(
        'loadedmetadata',
        updateClipProgress
    );

    videoPlayer.addEventListener(
        'durationchange',
        updateClipProgress
    );

    videoPlayer.addEventListener(
        'timeupdate',
        updateClipProgress
    );

    videoPlayer.addEventListener('ended', () => {
        // Be explicit: leave the clip parked at its end; do not recycle it.
        videoPlayer.pause();
        updateClipProgress();
    });

    function clearPreview() {
        const video = document.getElementById('video-player');
        const img = document.getElementById('preview-img');
        const placeholder = document.getElementById('placeholder');
        const info = document.getElementById('info-text');
        const clearBtn = document.getElementById('clear-preview');

        // Stop and reset any recorded clip currently playing.
        stopClipPlayback();

        // Remove any camera preview image.
        img.style.display = 'none';
        img.removeAttribute('src');

        // Restore the empty preview display.
        placeholder.style.display = 'block';
        info.textContent = 'No selection';
        clearBtn.classList.remove('visible');

        // Remove all camera and clip selection highlighting.
        document.querySelectorAll('.camera-card').forEach(c => {
            c.classList.remove('active');
        });

        document.querySelectorAll('#clip-list li').forEach(el => {
            el.classList.remove('active');
        });
    }

// 2026-08-14 - Dan/Sage:
// Mark every unreviewed clip in the complete clip collection as reviewed.
// Search and date filters do not limit this operation.
async function markAllClipsViewed() {
    const btn = document.getElementById('mark-all-viewed-btn');

    const count = allClips.filter(
        clip => clip.watched === false
    ).length;

    if (count === 0) {
        return;

    const confirmed = confirm(
        `Mark all ${count} unreviewed clips as reviewed?\n\n` +

    );

    const originalText = btn.textContent;

    btn.disabled = true;
    btn.classList.add('busy');
    btn.innerHTML =
        '<span class="mark-all-spinner" aria-hidden="true"></span>Marking...';

    try {

        if (!res.ok || !data.ok) {

        }

        allClips.forEach(clip => {

  // 2026-08-14 - Dan/Sage:
  // Display the event that triggered each recorded clip.
  // Smart detections take precedence over generic motion.
  function clipIcon(clip) {
      const cv = clip.cv_detection || [];
      const hasPerson = cv.includes('person');
      const hasVehicle = cv.includes('vehicle');

      if (hasPerson && hasVehicle) return '🚶🚗';
      if (hasPerson) return '🚶';
      if (hasVehicle) return '🚗';

      if (
          clip.source === 'cv_motion' ||
          clip.source === 'pir'
      ) {
          return '〰️';
      }

      if (clip.source === 'snapshot') return '📷';

      return '❓';
  }

  function clipTitle(clip) {
      const cv = clip.cv_detection || [];
      const hasPerson = cv.includes('person');
      const hasVehicle = cv.includes('vehicle');

      if (hasPerson && hasVehicle) return 'Person + Vehicle';
      if (hasPerson) return 'Person';
      if (hasVehicle) return 'Vehicle';

      if (
          clip.source === 'cv_motion' ||
          clip.source === 'pir'
      ) {
          return 'Motion';
      }

      if (clip.source === 'snapshot') return 'Snapshot';

      return 'Unknown trigger';
  }

  function changeClipSort(value) {
    clipSort = value === 'oldest' ? 'oldest' : 'newest';
    localStorage.setItem('blink_clip_sort', clipSort);
    renderClips();
  }

  function renderClips() {
    const list = document.getElementById('clip-list');
    const status = document.getElementById('search-status');
    list.innerHTML = '';

    let visible = [...allClips];

    if (activeFilter.length > 0) {
      const q = activeFilter.toLowerCase();
      visible = visible.filter(c => c.filename.toLowerCase().includes(q));
    }

    if (dateStart || dateEnd) {
      visible = visible.filter(c => {
        const d = new Date(c.recorded_at || c.modified);
        if (dateStart && d < dateStart) return false;
        if (dateEnd && d > dateEnd) return false;
        return true;
      });
    }

      // Sort by the camera recording time, not the local download time.
      visible.sort((a, b) => {
          const aTime = Date.parse(a.recorded_at || a.modified);
          const bTime = Date.parse(b.recorded_at || b.modified);

          const safeA = Number.isNaN(aTime) ? 0 : aTime;
          const safeB = Number.isNaN(bTime) ? 0 : bTime;

          return clipSort === 'oldest'
              ? safeA - safeB
              : safeB - safeA;
      });

    const parts = [];
    if (activeFilter) parts.push(`"${activeFilter}"`);
    if (dateStart || dateEnd) parts.push(formatRangeForStatus());
    const filterDesc = parts.join(' + ');

    if (allClips.length === 0) {
      list.innerHTML = '<li>No clips yet</li>';
      status.textContent = '';
      return;
    }

    if (filterDesc) {
      status.textContent = `${visible.length} of ${allClips.length} match ${filterDesc}`;
    } else {
      status.textContent = `${allClips.length} clip(s)`;
    }

    if (visible.length === 0) {
      list.innerHTML = `<li style="color:#888">No clips match ${filterDesc}</li>`;
      return;
    }

    visible.forEach(clip => {
      const li = document.createElement('li');
        // 2026-08-13 - Dan/Sage:
        // Display each recorded clip in a compact three-column layout modeled
        // after the Blink app.  A thumbnail placeholder is used for now;
        // actual clip thumbnails will be added as a separate step.
        const recordedAt = new Date(
            clip.recorded_at || clip.modified
        );

        const clipDate = recordedAt.toLocaleDateString();
        const clipTime = recordedAt.toLocaleTimeString([], {
            hour: 'numeric',
            minute: '2-digit'
        });

        const icon = clipIcon(clip);

        const unviewedIndicator = clip.watched === false
            ? '<span class="clip-unviewed-indicator" title="Unviewed clip"></span>'
            : '';

        li.innerHTML = `
          <div class="clip-thumbnail-column">
            <img
            class="clip-thumbnail"
            src="/api/clip_thumbnail/${encodeURIComponent(clip.filename)}"
            alt=""
            loading="lazy"
            onerror="this.style.display='none';"
          >
        </div>

            <div class="clip-info-column">
                <div class="clip-camera-name" title="${clip.filename}">
                  ${clip.camera_name || 'Unknown camera'}
            </div>

            <div class="clip-system-name">
               ${clip.network_name || 'Unknown system'}
            </div>

            <div class="clip-datetime">
                ${clipDate} · ${clipTime}
            </div>
        </div>

        <div class="clip-status-column">
          <div class="clip-status-top">
            ${unviewedIndicator}
            <button class="clip-delete-btn"
                    title="Delete this clip">🗑</button>
          </div>

          <div class="clip-trigger"
               title="${clipTitle(clip)}">
            <span class="clip-icon">${icon}</span>
          </div>
        </div>
       `;

      li.onclick = () => playClip(clip.filename, li, clip);
      li.querySelector('.clip-delete-btn').onclick = (e) => confirmDeleteClip(e, clip.filename);
      list.appendChild(li);
    });
  }

    // 2026-08-11 - Dan/Sage:
    // When playback begins, tell Blink that this clip has been viewed.
    // Blink remains the authoritative source; the Flask endpoint also
    // updates the local sidecar after Blink accepts the request.
    async function markClipViewed(clip, li) {
        if (!clip || clip.watched !== false || clip._markingViewed) {
            return;
        }

        clip._markingViewed = true;

        try {
            const res = await fetch('/api/clips/mark-viewed', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: clip.filename })
            });

            const data = await res.json();

            if (!res.ok || !data.ok) {
                throw new Error(data.error || 'unknown error');
            }

            clip.watched = true;

            // 2026-08-13 - Dan/Sage:
            // Keep the global unreviewed-clip badge synchronized immediately
            // when an individual clip is successfully marked as viewed.
            updateUnreviewedCount();

            const indicator = li.querySelector('.clip-unviewed-indicator');

            if (indicator) {
                indicator.remove();
            }

        } catch (e) {
            console.error(
                `Unable to mark ${clip.filename} as viewed:`,
                e
            );
        } finally {
            clip._markingViewed = false;
        }
    }

  // --- Delete a clip (with confirm second-chance cancel) ----------------
  async function confirmDeleteClip(event, filename) {
    event.stopPropagation();  // don't trigger the row's click-to-play

    const ok = confirm(
      `Delete this clip permanently?\n\n${filename}\n\nThis removes the local copy and cannot be undone.`
    );
    if (!ok) return;  // Cancel — nothing happens

    try {
      const res = await fetch('/api/clips/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({filename: filename})
      });
      const data = await res.json();

      if (data.ok) {
        // If the deleted clip is currently in the preview pane, clear it
        const info = document.getElementById('info-text').textContent;
        if (info === `🎬 ${filename}`) clearPreview();
        loadClips();
      } else {
        alert('Delete failed: ' + (data.error || 'unknown error'));
      }
    } catch (e) {
      alert('Delete failed: ' + e);
    }
  }

  function formatRangeForStatus() {
    const fmt = d => d.toLocaleDateString();
    if (dateStart && dateEnd) return `${fmt(dateStart)} – ${fmt(dateEnd)}`;
    if (dateStart) return `from ${fmt(dateStart)}`;
    if (dateEnd) return `until ${fmt(dateEnd)}`;
    return '';
  }

  function onSearchInput() {
    const input = document.getElementById('search-input');
    const clearBtn = document.getElementById('search-clear');
    clearBtn.classList.toggle('visible', input.value.length > 0);

    if (input.value.length === 0 && activeFilter.length > 0) {
      activeFilter = "";
      renderClips();
    }
  }

  function onSearchKey(e) {
    if (e.key === 'Enter') {
      activeFilter = e.target.value.trim();
      renderClips();
    }
  }

  function clearSearch() {
    const input = document.getElementById('search-input');
    input.value = "";
    activeFilter = "";
    document.getElementById('search-clear').classList.remove('visible');
    renderClips();
    input.focus();
  }

  function toggleDatePopover(e) {
    e.stopPropagation();
    document.getElementById('date-popover').classList.toggle('open');
  }

  function closeDatePopover() {
    document.getElementById('date-popover').classList.remove('open');
  }

  function applyPreset(preset) {
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    const todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);

    if (preset === 'today') {
      dateStart = todayStart; dateEnd = todayEnd;
    } else if (preset === 'yesterday') {
      const y = new Date(todayStart);
      y.setDate(y.getDate() - 1);
      dateStart = y;
      dateEnd = new Date(y.getFullYear(), y.getMonth(), y.getDate(), 23, 59, 59);
    } else if (preset === 'last7') {
      const s = new Date(todayStart);
      s.setDate(s.getDate() - 6);
      dateStart = s; dateEnd = todayEnd;
    } else if (preset === 'last30') {
      const s = new Date(todayStart);
      s.setDate(s.getDate() - 29);
      dateStart = s; dateEnd = todayEnd;
    }

    syncInputsFromDates();
    updateDateButton();
    closeDatePopover();
    renderClips();
  }

  function applyCustomRange() {
    const startStr = document.getElementById('date-start').value;
    const endStr = document.getElementById('date-end').value;

    if (!startStr && !endStr) {
      dateStart = null; dateEnd = null;
    } else {
      if (startStr) {
        const [y, m, d] = startStr.split('-').map(Number);
        dateStart = new Date(y, m - 1, d, 0, 0, 0);
      } else { dateStart = null; }
      if (endStr) {
        const [y, m, d] = endStr.split('-').map(Number);
        dateEnd = new Date(y, m - 1, d, 23, 59, 59);
      } else { dateEnd = null; }
    }

    updateDateButton();
    closeDatePopover();
    renderClips();
  }

  function clearDateFilter() {
    dateStart = null; dateEnd = null;
    document.getElementById('date-start').value = '';
    document.getElementById('date-end').value = '';
    updateDateButton();
    renderClips();
  }

  function syncInputsFromDates() {
    const fmt = d => {
      if (!d) return '';
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };
    document.getElementById('date-start').value = fmt(dateStart);
    document.getElementById('date-end').value = fmt(dateEnd);
  }

  function updateDateButton() {
    const btn = document.getElementById('date-btn');
    const clearBtn = document.getElementById('date-clear');
    const fmt = d => d.toLocaleDateString(undefined, {month: 'short', day: 'numeric'});

    if (dateStart && dateEnd) {
      const sameDay = dateStart.toDateString() === new Date(dateEnd.getFullYear(), dateEnd.getMonth(), dateEnd.getDate()).toDateString();
      btn.textContent = sameDay ? `📅 ${fmt(dateStart)}` : `📅 ${fmt(dateStart)} – ${fmt(dateEnd)}`;
      btn.classList.add('active');
      clearBtn.classList.add('visible');
    } else if (dateStart) {
      btn.textContent = `📅 from ${fmt(dateStart)}`;
      btn.classList.add('active');
      clearBtn.classList.add('visible');
    } else if (dateEnd) {
      btn.textContent = `📅 until ${fmt(dateEnd)}`;
      btn.classList.add('active');
      clearBtn.classList.add('visible');
    } else {
      btn.textContent = '📅 Any date';
      btn.classList.remove('active');
      clearBtn.classList.remove('visible');
    }
  }

  loadCameras();
  loadClips();
</script>
</body>
</html>
